<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">극좌표 운동의 방사 방향과 접선 방향</title><desc id="fig-desc">원의 오른쪽 끝점에서 e_r는 바깥쪽이고 e_θ는 반시계 회전 방향입니다.</desc><rect width="800" height="430" rx="16" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="15" fill="none" stroke="#DBE4ED"/><text x="30" y="38" font-family="sans-serif" font-size="21" font-weight="700" fill="#1A2A3C">극좌표 운동의 방사 방향과 접선 방향</text><text x="30" y="61" font-family="sans-serif" font-size="12.5" fill="#52677E">원의 오른쪽 끝점에서 e_r는 바깥쪽이고 e_θ는 반시계 회전 방향입니다.</text><line x1="95" y1="249" x2="755" y2="249" stroke="#E3EAF0" stroke-width="1.7" /><line x1="288" y1="382" x2="288" y2="96" stroke="#E3EAF0" stroke-width="1.7" /><circle cx="288" cy="249" r="120" fill="#F3F8FC" stroke="#2465A5" stroke-width="3"/><line x1="288" y1="249" x2="408" y2="249" stroke="#2465A5" stroke-width="3.5" /><polygon points="408,249 397,254 397,244" fill="#2465A5"/><line x1="408" y1="249" x2="533" y2="249" stroke="#008F86" stroke-width="3.5" /><polygon points="533,249 522,254 522,244" fill="#008F86"/><line x1="408" y1="249" x2="408" y2="134" stroke="#D67C39" stroke-width="3.5" /><polygon points="408,134 413,145 403,145" fill="#D67C39"/><circle cx="408" cy="249" r="6" fill="#2465A5" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="288" cy="249" r="5" fill="#52677E" stroke="#FFFFFF" stroke-width="1.5"/><text x="337" y="236" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700" text-anchor="start">r = 2 m</text><text x="496" y="273" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700" text-anchor="start">e_r</text><text x="423" y="137" font-family="sans-serif" font-size="15" fill="#D67C39" font-weight="700" text-anchor="start">e_θ</text><text x="591" y="138" font-family="sans-serif" font-size="15" fill="#52677E" font-weight="400" text-anchor="start">r 일정: ṙ = 0</text><text x="591" y="172" font-family="sans-serif" font-size="17" fill="#D67C39" font-weight="700" text-anchor="start">접선 속도</text><text x="591" y="201" font-family="sans-serif" font-size="17" fill="#1A2A3C" font-weight="400" text-anchor="start">v = r·θ̇</text><text x="591" y="236" font-family="sans-serif" font-size="14" fill="#2465A5" font-weight="700" text-anchor="start">중심 방향 가속도</text><text x="591" y="263" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">a_r = −r·θ̇²</text></svg>