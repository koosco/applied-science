<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">벡터의 두 성분과 크기</title><desc id="fig-desc">동쪽 3m와 북쪽 4m 이동을 하나의 벡터로 표현합니다.</desc><rect width="800" height="430" rx="16" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="15" fill="none" stroke="#DBE4ED"/><text x="30" y="38" font-family="sans-serif" font-size="21" font-weight="700" fill="#1A2A3C">벡터의 두 성분과 크기</text><text x="30" y="61" font-family="sans-serif" font-size="12.5" fill="#52677E">동쪽 3m와 북쪽 4m 이동을 하나의 벡터로 표현합니다.</text><line x1="87" y1="88" x2="87" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="132" y1="88" x2="132" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="177" y1="88" x2="177" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="222" y1="88" x2="222" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="267" y1="88" x2="267" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="312" y1="88" x2="312" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="357" y1="88" x2="357" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="402" y1="88" x2="402" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="447" y1="88" x2="447" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="492" y1="88" x2="492" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="537" y1="88" x2="537" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="582" y1="88" x2="582" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="627" y1="88" x2="627" y2="364" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="113" x2="668" y2="113" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="158" x2="668" y2="158" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="203" x2="668" y2="203" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="248" x2="668" y2="248" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="293" x2="668" y2="293" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="338" x2="668" y2="338" stroke="#E3EAF0" stroke-width="0.75" /><line x1="64" y1="338" x2="668" y2="338" stroke="#52677E" stroke-width="1.7" /><polygon points="668,338 657,343 657,333" fill="#52677E"/><line x1="177" y1="364" x2="177" y2="88" stroke="#52677E" stroke-width="1.7" /><polygon points="177,88 182,99 172,99" fill="#52677E"/><line x1="312" y1="338" x2="312" y2="158" stroke="#2465A5" stroke-width="2" stroke-dasharray="5 5"/><line x1="177" y1="338" x2="312" y2="158" stroke="#008F86" stroke-width="4" /><polygon points="312,158 309.4,169.8 301.4,163.8" fill="#008F86"/><circle cx="312" cy="158" r="5" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><text x="244.5" y="359" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700" text-anchor="middle">x = 3 m</text><text x="326" y="248" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700" text-anchor="start">y = 4 m</text><text x="208" y="224" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700" text-anchor="start">r = 5 m</text><text x="160" y="360" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">O</text><text x="322" y="150" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700" text-anchor="start">(3, 4)</text><text x="670" y="342" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">+x / 동쪽</text><text x="189" y="93" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">+y / 북쪽</text><text x="475" y="148" font-family="sans-serif" font-size="16" fill="#1A2A3C" font-weight="700" text-anchor="start">성분: (3, 4) m</text><text x="475" y="182" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">길이: √(3²+4²) = 5 m</text></svg>