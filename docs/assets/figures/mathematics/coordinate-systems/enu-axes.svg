<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">ENU 3차원 직교좌표계</title><desc id="fig-desc">East North Up의 세 축은 실제 공간에서 서로 수직입니다.</desc><rect width="800" height="430" rx="16" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="15" fill="none" stroke="#DBE4ED"/><text x="30" y="38" font-family="sans-serif" font-size="21" font-weight="700" fill="#1A2A3C">ENU 3차원 직교좌표계</text><text x="30" y="61" font-family="sans-serif" font-size="12.5" fill="#52677E">East North Up의 세 축은 실제 공간에서 서로 수직입니다.</text><line x1="305" y1="304" x2="594" y2="304" stroke="#2465A5" stroke-width="4" /><polygon points="594,304 583,309 583,299" fill="#2465A5"/><line x1="305" y1="304" x2="449" y2="177" stroke="#008F86" stroke-width="4" /><polygon points="449,177 444.05735870507505,188.02589211944786 437.4428650859448,180.52599384263874" fill="#008F86"/><line x1="305" y1="304" x2="305" y2="95" stroke="#D67C39" stroke-width="4" /><polygon points="305,95 310,106 300,106" fill="#D67C39"/><text x="602" y="310" font-family="sans-serif" font-size="17" fill="#2465A5" font-weight="700" text-anchor="start">x : East / 동쪽</text><text x="450" y="162" font-family="sans-serif" font-size="17" fill="#008F86" font-weight="700" text-anchor="start">y : North / 북쪽</text><text x="322" y="102" font-family="sans-serif" font-size="17" fill="#D67C39" font-weight="700" text-anchor="start">z : Up / 위쪽</text><circle cx="305" cy="304" r="6" fill="#52677E" stroke="#FFFFFF" stroke-width="1.5"/><text x="275" y="329" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">O</text><text x="520" y="119" font-family="sans-serif" font-size="18" fill="#1A2A3C" font-weight="700" text-anchor="start">ENU 좌표 예시</text><text x="520" y="149" font-family="sans-serif" font-size="17" fill="#1A2A3C" font-weight="400" text-anchor="start">(E, N, U)</text><text x="520" y="183" font-family="sans-serif" fon