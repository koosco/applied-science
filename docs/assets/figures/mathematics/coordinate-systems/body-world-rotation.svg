<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">기체 기준과 지면 기준의 좌표 변환</title><desc id="fig-desc">양의 회전 90°이면 기체 전방 이동은 지면 기준 북쪽으로 표현됩니다.</desc><rect width="800" height="430" rx="16" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="15" fill="none" stroke="#DBE4ED"/><text x="30" y="38" font-family="sans-serif" font-size="21" font-weight="700" fill="#1A2A3C">기체 기준과 지면 기준의 좌표 변환</text><text x="30" y="61" font-family="sans-serif" font-size="12.5" fill="#52677E">양의 회전 90°이면 기체 전방 이동은 지면 기준 북쪽으로 표현됩니다.</text><line x1="371" y1="310" x2="660" y2="310" stroke="#2465A5" stroke-width="3" /><polygon points="660,310 649,315 649,305" fill="#2465A5"/><line x1="371" y1="310" x2="371" y2="104" stroke="#2465A5" stroke-width="2" /><polygon points="371,104 376,115 366,115" fill="#2465A5"/><line x1="371" y1="310" x2="178" y2="310" stroke="#D67C39" stroke-width="3.2" /><polygon points="178,310 189,305 189,315" fill="#D67C39"/><line x1="371" y1="310" x2="371" y2="139" stroke="#008F86" stroke-width="5" /><polygon points="371,139 376,150 366,150" fill="#008F86"/><path d="M 444 310 A 73 73 0 0 0 371 237" fill="none" stroke="#8755A3" stroke-width="2.5" stroke-dasharray="7 5"/><text x="669" y="316" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700" text-anchor="start">World +x / 동쪽</text><text x="384" y="102" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700" text-anchor="start">World +y / 북쪽</text><text x="168" y="296" font-family="sans-serif" font-size="15" fill="#D67C39" font-weight="700" text-anchor="end">Body +y</text><text x="357" y="134" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700" text-anchor="end">Body +x</text><text x="455" y="255" font-family="sans-serif" font-size="15" fill="#8755A3" font-weight="700" text-anchor="start">ψ = +90°</text><text x="473" y="173" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700" text-anchor="start">기체 전방 2m</text><text x="473" y="201" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="700" text-anchor="start">= 지면 북쪽 2m</text><text x="473" y="232" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400" text-anchor="start">R(90°)·(2,0) = (0,2)</text><circle cx="371" cy="310" r="5" fill="#52677E" stroke="#FFFFFF" stroke-width="1.5"/></svg>