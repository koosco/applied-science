<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="current-ref-title current-ref-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="current-ref-title">전류의 기준 방향을 반대로 그리면 전류의 부호만 바뀐다</title>
  <desc id="current-ref-desc">두 그림 모두 실제로 양전하가 오른쪽에서 왼쪽으로 초당 3쿨롬씩 이동하며 점선 화살표로 나타낸다. 위쪽 그림은 기준 방향 화살표를 왼쪽에서 오른쪽으로 그려 실제 흐름과 반대이므로 i는 마이너스 3암페어이다. 아래쪽 그림은 화살표를 오른쪽에서 왼쪽으로 그려 실제 흐름과 같으므로 i는 플러스 3암페어이다.</desc>
  <defs>
    <marker id="ref-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#2063b1"/></marker>
    <marker id="actual-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#8050a2"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="578" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#182b45">
    <text x="28" y="43" font-size="27" font-weight="700">전류 화살표는 부호를 읽는 기준</text>
    <text x="28" y="78" font-size="20">실제 흐름은 같고 화살표만 반대로 그렸습니다.</text>

    <text x="28" y="140" font-size="21" font-weight="700">① 화살표: 왼쪽 → 오른쪽</text>
    <path d="M220 172 H420" stroke="#2063b1" stroke-width="3.5" marker-end="url(#ref-arrow)"/>
    <text x="320" y="162" text-anchor="middle" font-size="19" fill="#2063b1">기준 방향 i</text>
    <path d="M120 206 H520" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="190" width="160" height="32" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <path d="M420 240 H220" stroke="#8050a2" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#actual-arrow)"/>
    <text x="320" y="266" text-anchor="middle" font-size="18" fill="#8050a2">실제 양전하 이동 3 C/s</text>
    <text x="320" y="300" text-anchor="middle" font-size="23" font-weight="700">반대 방향 → i = −3 A</text>

    <path d="M28 322 H612" stroke="#cbd5e1"/>

    <text x="28" y="364" font-size="21" font-weight="700">② 화살표: 오른쪽 → 왼쪽</text>
    <path d="M420 396 H220" stroke="#2063b1" stroke-width="3.5" marker-end="url(#ref-arrow)"/>
    <text x="320" y="386" text-anchor="middle" font-size="19" fill="#2063b1">기준 방향 i</text>
    <path d="M120 430 H520" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="414" width="160" height="32" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <path d="M420 464 H220" stroke="#8050a2" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#actual-arrow)"/>
    <text x="320" y="490" text-anchor="middle" font-size="18" fill="#8050a2">실제 양전하 이동 3 C/s</text>
    <text x="320" y="524" text-anchor="middle" font-size="23" font-weight="700">같은 방향 → i = +3 A</text>

    <text x="320" y="558" text-anchor="middle" font-size="18" fill="#52647b">실선은 그리는 사람이 정한 기준, 점선은 실제 흐름입니다.</text>
  </g>
</svg>
