<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="polarity-title polarity-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="polarity-title">전압의 기준 극성은 어느 단자에서 어느 단자를 뺄지 정한다</title>
  <desc id="polarity-desc">같은 소자의 왼쪽 단자 전위가 15볼트, 오른쪽 단자 전위가 5볼트이다. 위쪽 그림처럼 왼쪽에 플러스, 오른쪽에 마이너스를 붙이면 v는 15볼트 빼기 5볼트로 플러스 10볼트이다. 아래쪽 그림처럼 오른쪽에 플러스, 왼쪽에 마이너스를 붙이면 v는 5볼트 빼기 15볼트로 마이너스 10볼트이다. 실제 전위는 그대로이고 표시만 바뀌었다.</desc>
  <rect x="1" y="1" width="638" height="578" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#182b45">
    <text x="28" y="43" font-size="27" font-weight="700">전압의 +, −는 빼는 순서를 정한다</text>
    <text x="28" y="78" font-size="20">같은 소자, 같은 실제 전위 · 표시만 바꾸었습니다.</text>

    <text x="28" y="140" font-size="21" font-weight="700">① 왼쪽에 +, 오른쪽에 −</text>
    <path d="M148 200 H240 M400 200 H492" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="172" width="160" height="56" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <text x="320" y="208" text-anchor="middle" font-size="21">소자</text>
    <circle cx="140" cy="200" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <circle cx="500" cy="200" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="140" y="178" text-anchor="middle" font-size="32" font-weight="700" fill="#b94435">+</text>
    <text x="500" y="178" text-anchor="middle" font-size="32" font-weight="700" fill="#2063b1">−</text>
    <text x="140" y="240" text-anchor="middle" font-size="19" fill="#52647b">전위 15 V</text>
    <text x="500" y="240" text-anchor="middle" font-size="19" fill="#52647b">전위 5 V</text>
    <text x="320" y="285" text-anchor="middle" font-size="23" font-weight="700">v = V₊ − V₋ = 15 V − 5 V = +10 V</text>

    <path d="M28 314 H612" stroke="#cbd5e1"/>

    <text x="28" y="356" font-size="21" font-weight="700">② 오른쪽에 +, 왼쪽에 −</text>
    <path d="M148 416 H240 M400 416 H492" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="388" width="160" height="56" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <text x="320" y="424" text-anchor="middle" font-size="21">소자</text>
    <circle cx="140" cy="416" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <circle cx="500" cy="416" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="140" y="394" text-anchor="middle" font-size="32" font-weight="700" fill="#2063b1">−</text>
    <text x="500" y="394" text-anchor="middle" font-size="32" font-weight="700" fill="#b94435">+</text>
    <text x="140" y="456" text-anchor="middle" font-size="19" fill="#52647b">전위 15 V</text>
    <text x="500" y="456" text-anchor="middle" font-size="19" fill="#52647b">전위 5 V</text>
    <text x="320" y="501" text-anchor="middle" font-size="23" font-weight="700">v = V₊ − V₋ = 5 V − 15 V = −10 V</text>

    <text x="320" y="548" text-anchor="middle" font-size="19" fill="#52647b">음수는 실제 높낮이가 표시와 반대라는 뜻입니다.</text>
  </g>
</svg>
