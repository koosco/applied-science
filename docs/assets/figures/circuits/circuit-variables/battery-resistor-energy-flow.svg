<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="loop-title loop-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="loop-title">같은 전류가 배터리에서는 전위를 오르고 저항에서는 전위를 내려간다</title>
  <desc id="loop-desc">왼쪽의 배터리와 오른쪽의 저항이 위아래 전선으로 연결된 닫힌 회로이다. 두 소자 모두 실제로 높은 쪽인 위쪽에 플러스, 아래쪽에 마이너스가 붙어 있다. 전류는 시계 방향으로 배터리 플러스 단자, 위쪽 전선, 저항 플러스 단자, 저항 마이너스 단자, 아래쪽 전선, 배터리 마이너스 단자 순서로 흐른다. 저항 안에서 양전하는 플러스에서 마이너스로 내려가 에너지를 잃으므로 저항은 흡수한다. 배터리 안에서는 마이너스에서 플러스로 올라가 에너지를 얻으므로 배터리는 공급한다.</desc>
  <defs>
    <marker id="loop-current" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#2063b1"/></marker>
    <marker id="loop-supply" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#16756b"/></marker>
    <marker id="loop-absorb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#b45309"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="618" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#182b45">
    <text x="28" y="43" font-size="27" font-weight="700">공급하는 소자와 흡수하는 소자</text>
    <text x="28" y="78" font-size="20">각 소자의 실제로 높은 쪽에 +를 붙였습니다.</text>

    <path d="M160 260 V150 H480 V250 M480 350 V450 H160 V340" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="160" cy="300" r="42" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <text x="160" y="290" text-anchor="middle" font-size="28">+</text>
    <text x="160" y="330" text-anchor="middle" font-size="28">−</text>
    <text x="160" y="490" text-anchor="middle" font-size="20">배터리</text>
    <rect x="462" y="250" width="36" height="100" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <text x="530" y="270" font-size="28">+</text>
    <text x="530" y="346" font-size="28">−</text>
    <text x="480" y="490" text-anchor="middle" font-size="20">저항</text>

    <path d="M250 128 H390" stroke="#2063b1" stroke-width="3" marker-end="url(#loop-current)"/>
    <path d="M390 472 H250" stroke="#2063b1" stroke-width="3" marker-end="url(#loop-current)"/>
    <text x="320" y="117" text-anchor="middle" font-size="19" fill="#2063b1">전류 (시계 방향)</text>

    <path d="M100 340 V262" stroke="#16756b" stroke-width="4" marker-end="url(#loop-supply)"/>
    <path d="M560 290 V330" stroke="#b45309" stroke-width="4" marker-end="url(#loop-absorb)"/>

    <text x="215" y="232" font-size="19" font-weight="700" fill="#16756b">배터리: − → +</text>
    <text x="215" y="260" font-size="18" fill="#16756b">전위를 오름</text>
    <text x="215" y="286" font-size="18" fill="#16756b">전하가 에너지를 얻음</text>
    <text x="215" y="314" font-size="19" font-weight="700" fill="#16756b">→ 공급</text>

    <text x="440" y="358" text-anchor="end" font-size="19" font-weight="700" fill="#b45309">저항: + → −</text>
    <text x="440" y="386" text-anchor="end" font-size="18" fill="#b45309">전위를 내려감</text>
    <text x="440" y="412" text-anchor="end" font-size="18" fill="#b45309">전하가 에너지를 잃음</text>
    <text x="440" y="440" text-anchor="end" font-size="19" font-weight="700" fill="#b45309">→ 흡수</text>

    <path d="M28 518 H612" stroke="#cbd5e1"/>
    <text x="320" y="554" text-anchor="middle" font-size="21" font-weight="700">+, −는 항상 지금 보는 그 소자의 단자입니다.</text>
    <text x="320" y="590" text-anchor="middle" font-size="18" fill="#52647b">이상적인 모델에서 공급 전력의 합 = 흡수 전력의 합</text>
  </g>
</svg>
