<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="psc-title psc-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="psc-title">수동 부호 규약: 전류가 들어가는 단자에 따라 p = vi 또는 p = −vi</title>
  <desc id="psc-desc">두 그림 모두 소자의 왼쪽에 플러스, 오른쪽에 마이너스 기준 극성이 있다. 위쪽 그림은 전류 화살표가 왼쪽 플러스 단자에서 소자로 들어가므로 입구가 플러스 단자이고, V입구 빼기 V출구가 v가 되어 흡수 전력은 p 등호 vi이다. 아래쪽 그림은 화살표가 오른쪽 마이너스 단자에서 소자로 들어가므로 입구가 마이너스 단자이고, V입구 빼기 V출구가 마이너스 v가 되어 흡수 전력은 p 등호 마이너스 vi이다. p가 양수이면 흡수, 음수이면 공급이다.</desc>
  <defs><marker id="psc-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#2063b1"/></marker></defs>
  <rect x="1" y="1" width="638" height="628" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#182b45">
    <text x="28" y="43" font-size="27" font-weight="700">입구가 어느 단자인지로 식을 고른다</text>
    <text x="28" y="78" font-size="20">p는 소자가 흡수하는 전력 · v = V₊ − V₋</text>

    <text x="28" y="136" font-size="21" font-weight="700">① 전류가 + 단자로 들어감</text>
    <path d="M128 200 H240 M400 200 H512" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="172" width="160" height="56" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <text x="320" y="208" text-anchor="middle" font-size="21">소자</text>
    <circle cx="120" cy="200" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <circle cx="520" cy="200" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="120" y="178" text-anchor="middle" font-size="32" font-weight="700" fill="#b94435">+</text>
    <text x="520" y="178" text-anchor="middle" font-size="32" font-weight="700" fill="#2063b1">−</text>
    <text x="320" y="162" text-anchor="middle" font-size="20">v</text>
    <path d="M150 186 H222" stroke="#2063b1" stroke-width="3.5" marker-end="url(#psc-arrow)"/>
    <text x="186" y="176" text-anchor="middle" font-size="19" fill="#2063b1">i</text>
    <text x="120" y="240" text-anchor="middle" font-size="19" font-weight="700">입구</text>
    <text x="520" y="240" text-anchor="middle" font-size="19" fill="#52647b">출구</text>
    <text x="320" y="282" text-anchor="middle" font-size="21">V입구 − V출구 = V₊ − V₋ = v</text>
    <text x="320" y="316" text-anchor="middle" font-size="25" font-weight="700">p = vi</text>

    <path d="M28 340 H612" stroke="#cbd5e1"/>

    <text x="28" y="382" font-size="21" font-weight="700">② 전류가 − 단자로 들어감</text>
    <path d="M128 446 H240 M400 446 H512" stroke="#334155" stroke-width="4"/>
    <rect x="240" y="418" width="160" height="56" rx="6" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
    <text x="320" y="454" text-anchor="middle" font-size="21">소자</text>
    <circle cx="120" cy="446" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <circle cx="520" cy="446" r="8" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="120" y="424" text-anchor="middle" font-size="32" font-weight="700" fill="#b94435">+</text>
    <text x="520" y="424" text-anchor="middle" font-size="32" font-weight="700" fill="#2063b1">−</text>
    <text x="320" y="408" text-anchor="middle" font-size="20">v</text>
    <path d="M490 432 H418" stroke="#2063b1" stroke-width="3.5" marker-end="url(#psc-arrow)"/>
    <text x="454" y="422" text-anchor="middle" font-size="19" fill="#2063b1">i</text>
    <text x="120" y="486" text-anchor="middle" font-size="19" fill="#52647b">출구</text>
    <text x="520" y="486" text-anchor="middle" font-size="19" font-weight="700">입구</text>
    <text x="320" y="528" text-anchor="middle" font-size="21">V입구 − V출구 = V₋ − V₊ = −v</text>
    <text x="320" y="562" text-anchor="middle" font-size="25" font-weight="700">p = −vi</text>

    <text x="320" y="606" text-anchor="middle" font-size="18" fill="#52647b">p &gt; 0 흡수 · p &lt; 0 공급</text>
  </g>
</svg>
