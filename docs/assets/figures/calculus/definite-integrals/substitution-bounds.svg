<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="a b"><title id="a">정적분의 치환: 경계도 함께 바뀝니다</title><desc id="b">본문 예시 u=1+x², x가 0에서 1까지 증가하면 u는 1에서 2까지 증가합니다.</desc><rect width="800" height="400" rx="14" fill="white"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE6EF" fill="none"/><text x="29" y="35" font-family="sans-serif" font-size="20" font-weight="700" fill="#1A2A3C">정적분의 치환: 경계도 함께 바뀝니다</text><text x="29" y="59" font-family="sans-serif" font-size="12" fill="#56687A">본문 예시 u=1+x², x가 0에서 1까지 증가하면 u는 1에서 2까지 증가합니다.</text><text x="125" y="131" font-size="17" font-weight="700" fill="#2465A5" font-family="sans-serif">원래 변수 x</text><text x="535" y="131" font-size="17" font-weight="700" fill="#008F86" font-family="sans-serif">새 변수 u=1+x²</text><line x1="105" y1="229" x2="347" y2="229" stroke="#2465A5" stroke-width="4"/><line x1="476" y1="229" x2="718" y2="229" stroke="#008F86" stroke-width="4"/><circle cx="145" cy="229" r="7" fill="#2465A5"/><text x="145" y="165" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#2465A5">x=0</text><circle cx="303" cy="229" r="7" fill="#2465A5"/><text x="303" y="165" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#2465A5">x=1</text><circle cx="517" cy="229" r="7" fill="#008F86"/><text x="517" y="165" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#008F86">u=1</text><circle cx="675" cy="229" r="7" fill="#008F86"/><text x="675" y="165" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#008F86">u=2</text><path d="M363 229 h90 l-12 -11 m12 11 l-12 11" fill="none" stroke="#D67C39" stroke-width="3"/><text x="400" y="201" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#D67C39">치환</text><text x="400" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1A2A3C">dx의 변환과 함께 적분 구간도 [0,1] → [1,2]</text></svg>