<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="a b"><title id="a">미적분 학습의 큰 흐름</title><desc id="b">함수에서 변화율을 구하고 다시 누적량을 계산합니다.</desc><rect width="800" height="400" rx="14" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE6EF" fill="none"/><text x="30" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#1A2A3C">미적분 학습의 큰 흐름</text><text x="30" y="60" font-family="sans-serif" font-size="12" fill="#56687A">함수에서 변화율을 구하고 다시 누적량을 계산합니다.</text><rect x="34" y="137" width="158" height="122" rx="14" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="113" y="182" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1A2A3C">함수</text><text x="113" y="218" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#56687A">입력과 출력</text><path d="M198 199 h26 l-8 -8 m8 8 l-8 8" stroke="#D67C39" stroke-width="2.5" fill="none"/><rect x="227" y="137" width="158" height="122" rx="14" fill="#EAF7F2" stroke="#008F86" stroke-width="2"/><text x="306" y="182" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1A2A3C">미분법</text><text x="306" y="218" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#56687A">순간 변화율</text><path d="M391 199 h26 l-8 -8 m8 8 l-8 8" stroke="#D67C39" stroke-width="2.5" fill="none"/><rect x="420" y="137" width="158" height="122" rx="14" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="499" y="182" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1A2A3C">부정적분</text><text x="499" y="218" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#56687A">원시함수</text><path d="M584 199 h26 l-8 -8 m8 8 l-8 8" stroke="#D67C39" stroke-width="2.5" fill="none"/><rect x="613" y="137" width="158" height="122" rx="14" fill="#EAF7F2" stroke="#008F86" stroke-width="2"/><text x="692" y="182" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1A2A3C">정적분</text><text x="692" y="218" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#56687A">전체 누적량</text><text x="400" y="322" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#56687A">미분은 변화율, 적분은 변화량의 누적을 설명합니다.</text></svg>