<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="main-title main-description"><title id="main-title">그래디언트는 등고선의 법선 방향</title><desc id="main-description">f=x²+y², 점 (3,4)에서 ∇f=(6,8), 크기는 10</desc><rect width="800" height="430" rx="15" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="14" stroke="#DBE5EF" fill="none"/><text x="28" y="36" font-size="21" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">그래디언트는 등고선의 법선 방향</text><text x="28" y="59" font-size="12" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">f=x²+y², 점 (3,4)에서 ∇f=(6,8), 크기는 10</text><line x1="202" y1="243" x2="532" y2="243" stroke="#52687B" stroke-width="1.5" /><line x1="367" y1="408" x2="367" y2="78" stroke="#52687B" stroke-width="1.5" /><circle cx="367" cy="243" r="50" fill="none" stroke="#E4EBF2" stroke-width="2"/><circle cx="367" cy="243" r="100" fill="none" stroke="#2465A5" stroke-width="2"/><circle cx="367" cy="243" r="125" fill="none" stroke="#008F86" stroke-width="2"/><circle cx="442" cy="143" r="6" fill="#D67C39" stroke="#FFFFFF" stroke-width="1.5"/><line x1="442" y1="143" x2="469.5" y2="106.75" stroke="#D67C39" stroke-width="4" /><polygon points="469.5,106.75 467.1102579007911,117.48727771361385 459.80367665422364,111.9443540093213" fill="#D67C39"/><text x="455" y="137" font-size="15" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="start">(3,4)</text><text x="487" y="82" font-size="15" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="start">∇f=(6,8)</text><text x="555" y="250" font-size="15" fill="#008F86" font-family="sans-serif" font-weight="700" text-anchor="start">등고선 f=25</text><text x="555" y="283" font-size="15" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="start">법선 방향</text><text x="538" y="259" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">x</text><text x="381" y="76" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">y</text></svg>