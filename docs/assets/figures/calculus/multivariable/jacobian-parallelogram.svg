<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="main-title main-description"><title id="main-title">야코비안 행렬식과 면적 확대</title><desc id="main-description">(x,y)→(2x+y, x−y) 변환에서 작은 면적이 3배로 바뀝니다.</desc><rect width="800" height="430" rx="15" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="14" stroke="#DBE5EF" fill="none"/><text x="28" y="36" font-size="21" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">야코비안 행렬식과 면적 확대</text><text x="28" y="59" font-size="12" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">(x,y)→(2x+y, x−y) 변환에서 작은 면적이 3배로 바뀝니다.</text><text x="211" y="100" font-size="17" fill="#2465A5" font-family="sans-serif" font-weight="700" text-anchor="middle">입력 (x,y): 단위 정사각형</text><line x1="46" y1="245" x2="376" y2="245" stroke="#52687B" stroke-width="1.5" /><line x1="211" y1="360" x2="211" y2="130" stroke="#52687B" stroke-width="1.5" /><polygon points="211,245 250,245 250,206 211,206" fill="#2465A5" fill-opacity=".19" stroke="#2465A5" stroke-width="3"/><circle cx="211" cy="245" r="4" fill="#2465A5" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="250" cy="245" r="4" fill="#2465A5" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="250" cy="206" r="4" fill="#2465A5" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="211" cy="206" r="4" fill="#2465A5" stroke="#FFFFFF" stroke-width="1.5"/><text x="565" y="100" font-size="17" fill="#008F86" font-family="sans-serif" font-weight="700" text-anchor="middle">출력 (u,v): 평행사변형</text><line x1="400" y1="245" x2="730" y2="245" stroke="#52687B" stroke-width="1.5" /><line x1="565" y1="360" x2="565" y2="130" stroke="#52687B" stroke-width="1.5" /><polygon points="565,245 643,206 682,245 604,284" fill="#008F86" fill-opacity=".19" stroke="#008F86" stroke-width="3"/><circle cx="565" cy="245" r="4" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="643" cy="206" r="4" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="682" cy="245" r="4" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="604" cy="284" r="4" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><line x1="363" y1="245" x2="405" y2="245" stroke="#D67C39" stroke-width="3" /><polygon points="405,245 395.00137675357627,249.58557882672133 395.00137675357627,240.41442117327867" fill="#D67C39"/><text x="386" y="225" font-size="15" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="middle">J</text><text x="401" y="390" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="middle">J = [[2,1],[1,−1]],  det J = −3,  면적 배율 = 3</text></svg>