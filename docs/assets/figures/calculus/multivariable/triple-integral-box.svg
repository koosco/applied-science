<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="a b"><title id="a">삼중적분은 부피 전체의 밀도를 더합니다</title><desc id="b">2m × 1m × 3m 상자와 균일 밀도 2kg/m³의 가상 예시</desc><rect width="800" height="430" rx="15" fill="white"/><rect x="1" y="1" width="798" height="428" rx="14" fill="none" stroke="#DBE5ED"/><text x="30" y="37" font-family="sans-serif" font-size="20" fill="#1A2A3C" font-weight="700">삼중적분은 부피 전체의 밀도를 더합니다</text><text x="30" y="61" font-family="sans-serif" font-size="12" fill="#56687A" font-weight="400">2m × 1m × 3m 상자와 균일 밀도 2kg/m³의 가상 예시</text><polygon points="280,352 490,298 490,160 280,214" fill="#DDEBF8" stroke="#2465A5" stroke-width="2.5" fill-opacity=".8"/><polygon points="490,298 415,250 415,112 490,160" fill="#DDF3EB" stroke="#2465A5" stroke-width="2.5" fill-opacity=".8"/><polygon points="280,214 490,160 415,112 205,166" fill="#EDE7F8" stroke="#2465A5" stroke-width="2.5" fill-opacity=".8"/><text x="375" y="398" font-family="sans-serif" font-size="15" fill="#2465A5" font-weight="700">x = 2 m</text><text x="153" y="308" font-family="sans-serif" font-size="15" fill="#008F86" font-weight="700">y = 1 m</text><text x="501" y="202" font-family="sans-serif" font-size="15" fill="#D67C39" font-weight="700">z = 3 m</text><text x="564" y="132" font-family="sans-serif" font-size="18" fill="#1A2A3C" font-weight="700">ρ = 2 kg/m³</text><text x="564" y="169" font-family="sans-serif" font-size="16" fill="#1A2A3C" font-weight="400">부피 = 6 m³</text><text x="564" y="202" font-family="sans-serif" font-size="18" fill="#008F86" font-weight="700">질량 = 12 kg</text></svg>