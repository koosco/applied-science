<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="a b"><title id="a">이중적분은 높이×면적 요소를 누적합니다</title><desc id="b">단위 정사각형 위 가상 곡면 h(x,y)=x+y의 부피는 1m³입니다.</desc><rect width="800" height="430" rx="15" fill="white"/><rect x="1" y="1" width="798" height="428" rx="14" fill="none" stroke="#DBE5ED"/><text x="30" y="37" font-family="sans-serif" font-size="20" fill="#1A2A3C" font-weight="700">이중적분은 높이×면적 요소를 누적합니다</text><text x="30" y="61" font-family="sans-serif" font-size="12" fill="#56687A" font-weight="400">단위 정사각형 위 가상 곡면 h(x,y)=x+y의 부피는 1m³입니다.</text><polygon points="303,345 479,309 413,258 237,294" fill="#EEF3F8" stroke="#536477" stroke-width="2"/><line x1="479" y1="309" x2="479" y2="244" stroke="#BBC9D5" stroke-width="2" stroke-dasharray="6 5"/><line x1="413" y1="258" x2="413" y2="128" stroke="#BBC9D5" stroke-width="2" stroke-dasharray="6 5"/><line x1="237" y1="294" x2="237" y2="229" stroke="#BBC9D5" stroke-width="2" stroke-dasharray="6 5"/><polygon points="303,345 479,244 413,128 237,229" fill="#008F86" fill-opacity=".27" stroke="#2465A5" stroke-width="3"/><text x="545" y="145" font-family="sans-serif" font-size="17" fill="#2465A5" font-weight="700">h(x,y)=x+y (m)</text><text x="545" y="179" font-family="sans-serif" font-size="15" fill="#1A2A3C" font-weight="400">밑면: 1m × 1m</text><text x="545" y="212" font-family="sans-serif" font-size="20" fill="#008F86" font-weight="700">V = 1 m³</text><text x="325" y="398" font-family="sans-serif" font-size="13" fill="#56687A" font-weight="400">각 위치의 높이를 밑면의 작은 넓이에 곱해 누적합니다.</text></svg>