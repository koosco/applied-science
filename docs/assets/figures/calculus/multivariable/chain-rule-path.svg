<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="main-title main-description"><title id="main-title">다변수 연쇄법칙: 변화 경로를 합산</title><desc id="main-description">시간이 x(t), y(t)를 바꾸고 그 결과가 f(x,y)를 바꿉니다.</desc><rect width="800" height="430" rx="15" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="14" stroke="#DBE5EF" fill="none"/><text x="28" y="36" font-size="21" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">다변수 연쇄법칙: 변화 경로를 합산</text><text x="28" y="59" font-size="12" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">시간이 x(t), y(t)를 바꾸고 그 결과가 f(x,y)를 바꿉니다.</text><rect x="65" y="183" width="135" height="86" rx="15" fill="#F3F8FB" stroke="#2465A5" stroke-width="2.5"/><text x="132.5" y="217" font-size="17" fill="#2465A5" font-family="sans-serif" font-weight="700" text-anchor="middle">시간 t</text><text x="132.5" y="248" font-size="13" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="middle">입력 변화</text><rect x="321" y="99" width="170" height="86" rx="15" fill="#F3F8FB" stroke="#008F86" stroke-width="2.5"/><text x="406" y="133" font-size="17" fill="#008F86" font-family="sans-serif" font-weight="700" text-anchor="middle">x(t)</text><text x="406" y="164" font-size="13" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="middle">dx/dt</text><rect x="321" y="270" width="170" height="86" rx="15" fill="#F3F8FB" stroke="#D67C39" stroke-width="2.5"/><text x="406" y="304" font-size="17" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="middle">y(t)</text><text x="406" y="335" font-size="13" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="middle">dy/dt</text><rect x="620" y="183" width="131" height="86" rx="15" fill="#F3F8FB" stroke="#845CB0" stroke-width="2.5"/><text x="685.5" y="217" font-size="17" fill="#845CB0" font-family="sans-serif" font-weight="700" text-anchor="middle">f(x,y)</text><text x="685.5" y="248" font-size="13" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="middle">총 변화 df/dt</text><line x1="200" y1="224" x2="321" y2="142" stroke="#2465A5" stroke-width="2.5" /><polygon points="321,142 315.2954846988561,151.4052381776867 310.1504706746,143.8132052882356" fill="#2465A5"/><line x1="200" y1="224" x2="321" y2="312" stroke="#2465A5" stroke-width="2.5" /><polygon points="321,312 310.216644903929,309.827615855324 315.61086027059986,302.41056972615155" fill="#2465A5"/><line x1="491" y1="142" x2="620" y2="224" stroke="#008F86" stroke-width="2.5" /><polygon points="620,224 609.1019108160892,222.50612847288386 614.0217977117692,214.76630640528978" fill="#008F86"/><line x1="491" y1="312" x2="620" y2="224" stroke="#D67C39" stroke-width="2.5" /><polygon points="620,224 614.3243554934173,233.42268854599885 609.1560824308623,225.8464700792988" fill="#D67C39"/><text x="400" y="401" font-size="19" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="middle">df/dt = fₓ x′(t) + fᵧ y′(t)</text></svg>