<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="main-title main-description"><title id="main-title">다변수 함수의 등고선</title><desc id="main-description">f=x²+y²에서 등고선 f=1, f=4, f=9는 동심원입니다.</desc><rect width="800" height="430" rx="15" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="14" stroke="#DBE5EF" fill="none"/><text x="28" y="36" font-size="21" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">다변수 함수의 등고선</text><text x="28" y="59" font-size="12" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">f=x²+y²에서 등고선 f=1, f=4, f=9는 동심원입니다.</text><line x1="224" y1="242" x2="556" y2="242" stroke="#52687B" stroke-width="1.5" /><line x1="390" y1="408" x2="390" y2="76" stroke="#52687B" stroke-width="1.5" /><circle cx="390" cy="242" r="47" fill="none" stroke="#008F86" stroke-width="2.5"/><text x="449" y="230" font-size="14" fill="#008F86" font-family="sans-serif" font-weight="700" text-anchor="start">f=1</text><circle cx="390" cy="242" r="94" fill="none" stroke="#2465A5" stroke-width="2.5"/><text x="496" y="230" font-size="14" fill="#2465A5" font-family="sans-serif" font-weight="700" text-anchor="start">f=4</text><circle cx="390" cy="242" r="141" fill="none" stroke="#D67C39" stroke-width="2.5"/><text x="543" y="230" font-size="14" fill="#D67C39" font-family="sans-serif" font-weight="700" text-anchor="start">f=9</text><circle cx="390" cy="242" r="5" fill="#1A2A3C" stroke="#FFFFFF" stroke-width="1.5"/><text x="400" y="262" font-size="12" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">(0,0)</text><text x="562" y="246" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">x</text><text x="401" y="82" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">y</text><text x="69" y="140" font-size="19" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">f(x,y)=x²+y²</text><text x="69" y="170" font-size="15" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">같은 값의 점들이 원을 이룹니다.</text></svg>