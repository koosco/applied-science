<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="main-title main-description"><title id="main-title">다변수 최적화: 등고선의 중심이 최소점</title><desc id="main-description">f=(x−2)²+(y+1)², 최소값 0은 (2,−1)에서 나타납니다.</desc><rect width="800" height="430" rx="15" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="428" rx="14" stroke="#DBE5EF" fill="none"/><text x="28" y="36" font-size="21" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">다변수 최적화: 등고선의 중심이 최소점</text><text x="28" y="59" font-size="12" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">f=(x−2)²+(y+1)², 최소값 0은 (2,−1)에서 나타납니다.</text><line x1="223" y1="246" x2="555" y2="246" stroke="#52687B" stroke-width="1.5" /><line x1="389" y1="412" x2="389" y2="80" stroke="#52687B" stroke-width="1.5" /><circle cx="389" cy="246" r="41" stroke="#008F86" fill="none" stroke-width="2.5"/><circle cx="389" cy="246" r="82" stroke="#2465A5" fill="none" stroke-width="2.5"/><circle cx="389" cy="246" r="123" stroke="#D67C39" fill="none" stroke-width="2.5"/><circle cx="389" cy="246" r="7" fill="#008F86" stroke="#FFFFFF" stroke-width="1.5"/><text x="403" y="267" font-size="15" fill="#008F86" font-family="sans-serif" font-weight="700" text-anchor="start">최소점 (2,−1)</text><text x="69" y="136" font-size="17" fill="#1A2A3C" font-family="sans-serif" font-weight="700" text-anchor="start">f(x,y) = (x−2)² + (y+1)²</text><text x="69" y="169" font-size="14" fill="#52687B" font-family="sans-serif" font-weight="400" text-anchor="start">f=1, f=4, f=9</text><text x="560" y="251" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">x 증가</text><text x="399" y="81" font-size="15" fill="#1A2A3C" font-family="sans-serif" font-weight="400" text-anchor="start">y 증가</text></svg>