<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc"><title id="title">보존장: 퍼텐셜 차이만 결정</title><desc id="desc">같은 A와 B를 잇는 두 경로의 선적분이 같습니다.</desc><rect x="1" y="1" width="798" height="428" rx="14" fill="white" stroke="#DCE5EC"/><text x="28" y="36" font-family="sans-serif" font-size="21" fill="#1A2A3C">보존장: 퍼텐셜 차이만 결정</text><text x="28" y="59" font-family="sans-serif" font-size="12" fill="#596D7E">같은 A와 B를 잇는 두 경로의 선적분이 같습니다.</text><circle cx="356" cy="248" r="25" fill="none" stroke="#E5EBF2" stroke-width="1.5"/><circle cx="356" cy="248" r="50" fill="none" stroke="#E5EBF2" stroke-width="1.5"/><circle cx="356" cy="248" r="75" fill="none" stroke="#E5EBF2" stroke-width="1.5"/><circle cx="356" cy="248" r="100" fill="none" stroke="#E5EBF2" stroke-width="1.5"/><circle cx="356" cy="248" r="125" fill="none" stroke="#008F86" stroke-width="3"/><line x1="356" y1="248" x2="431" y2="148" stroke="#D67C39" stroke-width="3"/><polygon points="431,148 429.461633327019,155.85069601879104 423.89407449039527,151.67502689132323" fill="#D67C39"/><line x1="356" y1="248" x2="431" y2="248" stroke="#8061AB" stroke-width="2"/><line x1="431" y1="248" x2="431" y2="148" stroke="#8061AB" stroke-width="2"/><text x="366" y="267" font-family="sans-serif" font-size="14" fill="#596D7E">A</text><text x="442" y="139" font-family="sans-serif" font-size="14" fill="#008F86">B=(3,4)</text><text x="562" y="174" font-family="sans-serif" font-size="18" fill="#2465A5">φ=x²+y²</text><text x="562" y="211" font-family="sans-serif" font-size="16" fill="#2465A5">퍼텐셜 차이 = 25</text><text x="562" y="240" font-family="sans-serif" font-size="15" fill="#596D7E">경로에 무관</text></svg>