"/><text x="580" y="320" font-family="sans-serif" font-size="11" fill="#596D7E">2.0</text><line x1="100" y1="294" x2="580" y2="294" stroke="#2465A5" stroke-width="4"/><polygon points="580,294 572.7964231811786,297.4797242728898 572.7964231811786,290.5202757271102" fill="#2465A5"/><text x="310" y="130" font-family="sans-serif" font-size="18" fill="#D67C39">Fₓ=(1 N/m)·x</text><text x="310" y="168" font-family="sans-serif" font-size="16" fill="#596D7E">경로: x=0 → 2 m</text><text x="310" y="203" font-family="sans-serif" font-size="20" fill="#2465A5">W=∫₀² x dx=2 J</text><text x="700" y="324" font-family="sans-serif" font-size="12" fill="#596D7E">x (m)</text></svg>