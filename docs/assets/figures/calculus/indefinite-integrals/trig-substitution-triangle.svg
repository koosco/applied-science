<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">삼각치환: 직각삼각형으로 제곱근 이해</title><desc id="d">√(9 − x²)에서 x=3sinθ 치환을 선택하는 이유</desc><rect width="800" height="400" fill="#FFFFFF" rx="14"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE7EF" fill="none"/><text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A2A3C">삼각치환: 직각삼각형으로 제곱근 이해</text><text x="30" y="59" font-family="sans-serif" font-size="12" fill="#56687A">√(9 − x²)에서 x=3sinθ 치환을 선택하는 이유</text><path d="M170 312 L495 312 L495 120 Z" fill="#EDF4FB" stroke="#2465A5" stroke-width="3" stroke-linejoin="round"/><path d="M471 312 V289 H495" fill="none" stroke="#56687A" stroke-width="2"/><path d="M219 312 A49 49 0 0 0 212 285" fill="none" stroke="#D67C39" stroke-width="2.5"/><text x="230" y="294" font-family="sans-serif" font-size="17" fill="#D67C39">θ</text><text x="329" y="333" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#2465A5">√(9 − x²)</text><text x="514" y="215" font-size="18" font-family="sans-serif" fill="#008F86">x</text><text x="311" y="199" font-size="19" font-family="sans-serif" fill="#2465A5">3</text><text x="633" y="179" font-family="sans-serif" font-size="14" fill="#56687A" text-anchor="middle">sin θ = x / 3</text><text x="632" y="207" font-family="sans-serif" font-size="14" fill="#56687A" text-anchor="middle">x = 3 sin θ</text><text x="632" y="248" font-family="sans-serif" font-size="12" fill="#56687A" text-anchor="middle">그림: 0 ≤ θ ≤ π/2</text></svg>