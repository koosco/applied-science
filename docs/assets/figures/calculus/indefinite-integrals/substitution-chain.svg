<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">부정적분의 치환: 안쪽 함수를 찾기</title><desc id="d">본문 각속도 모델의 첫 번째 항을 치환한 예</desc><rect width="800" height="400" fill="#FFFFFF" rx="14"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE7EF" fill="none"/><text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A2A3C">부정적분의 치환: 안쪽 함수를 찾기</text><text x="30" y="59" font-family="sans-serif" font-size="12" fill="#56687A">본문 각속도 모델의 첫 번째 항을 치환한 예</text><rect x="41" y="133" width="210" height="110" rx="15" fill="#EDF4FA" stroke="#2465A5" stroke-width="2"/><text x="146" y="172" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="bold" fill="#1A2A3C">원래 변수</text><text x="146" y="207" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#56687A">t</text><path d="M260 185 h29 l-8 -8 m8 8 l-8 8" fill="none" stroke="#D67C39" stroke-width="2.5"/><rect x="291" y="133" width="210" height="110" rx="15" fill="#EEFAF6" stroke="#008F86" stroke-width="2"/><text x="396" y="172" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="bold" fill="#1A2A3C">안쪽 함수</text><text x="396" y="207" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#56687A">u = 0.3t²</text><path d="M510 185 h29 l-8 -8 m8 8 l-8 8" fill="none" stroke="#D67C39" stroke-width="2.5"/><rect x="541" y="133" width="210" height="110" rx="15" fill="#EDF4FA" stroke="#2465A5" stroke-width="2"/><text x="646" y="172" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="bold" fill="#1A2A3C">원시함수</text><text x="646" y="207" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#56687A">sin(u)</text><text x="400" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#56687A">d/dt sin(0.3t²) = 0.6t cos(0.3t²)</text><text x="400" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#56687A">치환은 이 연쇄법칙을 거꾸로 읽는 과정입니다.</text></svg>