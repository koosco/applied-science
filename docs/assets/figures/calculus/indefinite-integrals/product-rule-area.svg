<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">부분적분의 출발점: 곱의 미분</title><desc id="d">사각형의 너비 u와 높이 v가 함께 조금씩 증가하는 예시</desc><rect width="800" height="400" fill="#FFFFFF" rx="14"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE7EF" fill="none"/><text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A2A3C">부분적분의 출발점: 곱의 미분</text><text x="30" y="59" font-family="sans-serif" font-size="12" fill="#56687A">사각형의 너비 u와 높이 v가 함께 조금씩 증가하는 예시</text><rect x="145" y="166" width="285" height="132" fill="#E4F0FB" stroke="#2465A5" stroke-width="2"/><rect x="430" y="166" width="70" height="132" fill="#DDF5EC" stroke="#008F86" stroke-width="2"/><rect x="145" y="105" width="285" height="61" fill="#FDECD7" stroke="#D67C39" stroke-width="2"/><rect x="430" y="105" width="70" height="61" fill="#EFE5FA" stroke="#7C5CAB" stroke-width="2"/><text x="288" y="238" font-size="18" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#2465A5">u × v</text><text x="465" y="238" font-size="18" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#008F86">vΔu</text><text x="288" y="142" font-size="18" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#D67C39">uΔv</text><text x="465" y="141" font-size="18" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#7C5CAB">ΔuΔv</text><text x="290" y="323" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#56687A">너비 u</text><text x="466" y="323" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#56687A">Δu</text><text x="115" y="233" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#56687A">높이 v</text><text x="106" y="140" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#56687A">Δv</text><text x="548" y="258" font-size="13" font-family="sans-serif" fill="#56687A">작은 변화량</text><text x="548" y="278" font-size="13" font-family="sans-serif" fill="#56687A">Δ(uv) =</text><text x="548" y="300" font-size="13" font-family="sans-serif" fill="#56687A">vΔu + uΔv + ΔuΔv</text></svg>