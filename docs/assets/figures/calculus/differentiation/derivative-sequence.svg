<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="gtitle gdesc"><title id="gtitle">운동과 연속적인 미분</title><desc id="gdesc">같은 기준 좌표계에서 한 축의 움직임을 분석합니다.</desc><rect width="800" height="400" rx="14" fill="white"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE7EF" fill="none"/><text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A2A3C">운동과 연속적인 미분</text><text x="30" y="59" font-family="sans-serif" font-size="12" fill="#56687A">같은 기준 좌표계에서 한 축의 움직임을 분석합니다.</text><rect x="40" y="130" width="155" height="115" rx="15" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="117.5" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">위치 s(t)</text><text x="117.5" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">m</text><path d="M203 188 H215.33333333333334 l-8 -8 m8 8 l-8 8" stroke="#D67C39" fill="none" stroke-width="2.7"/><rect x="228.33333333333334" y="130" width="155" height="115" rx="15" fill="#EEF8F5" stroke="#008F86" stroke-width="2"/><text x="305.83333333333337" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">속도 v(t)</text><text x="305.83333333333337" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">m/s</text><path d="M391.33333333333337 188 H403.6666666666667 l-8 -8 m8 8 l-8 8" stroke="#D67C39" fill="none" stroke-width="2.7"/><rect x="416.6666666666667" y="130" width="155" height="115" rx="15" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="494.1666666666667" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">가속도 a(t)</text><text x="494.1666666666667" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">m/s²</text><path d="M579.6666666666667 188 H592.0000000000001 l-8 -8 m8 8 l-8 8" stroke="#D67C39" fill="none" stroke-width="2.7"/><rect x="605" y="130" width="155" height="115" rx="15" fill="#EEF8F5" stroke="#008F86" stroke-width="2"/><text x="682.5" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">저크 j(t)</text><text x="682.5" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">m/s³</text><text x="400" y="308" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#56687A">각 화살표는 '시간 t에 대한 미분'을 뜻합니다.</text></svg>