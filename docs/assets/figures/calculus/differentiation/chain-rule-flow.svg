<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="gtitle gdesc"><title id="gtitle">연쇄법칙: 변화율이 이어지는 방식</title><desc id="gdesc">y=g(f(x))의 입력을 두 단계로 바꿉니다.</desc><rect width="800" height="400" rx="14" fill="white"/><rect x="1" y="1" width="798" height="398" rx="13" stroke="#DFE7EF" fill="none"/><text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A2A3C">연쇄법칙: 변화율이 이어지는 방식</text><text x="30" y="59" font-family="sans-serif" font-size="12" fill="#56687A">y=g(f(x))의 입력을 두 단계로 바꿉니다.</text><rect x="40" y="130" width="190" height="115" rx="15" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="135" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">입력</text><text x="135" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">x</text><path d="M238 188 H292 l-8 -8 m8 8 l-8 8" stroke="#D67C39" fill="none" stroke-width="2.7"/><rect x="305" y="130" width="190" height="115" rx="15" fill="#EEF8F5" stroke="#008F86" stroke-width="2"/><text x="400" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">안쪽 함수</text><text x="400" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">u = f(x)</text><path d="M503 188 H557 l-8 -8 m8 8 l-8 8" stroke="#D67C39" fill="none" stroke-width="2.7"/><rect x="570" y="130" width="190" height="115" rx="15" fill="#EDF4FB" stroke="#2465A5" stroke-width="2"/><text x="665" y="173" font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2A3C">바깥 함수</text><text x="665" y="206" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#56687A">y = g(u)</text><text x="400" y="308" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#56687A">dy/dx = (dy/du) × (du/dx) = g′(f(x)) × f′(x)</text></svg>