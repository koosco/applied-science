<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">함수 단원 학습 흐름</title><desc id="desc">수학적 입력·출력 관계를 해석하는 네 가지 관점</desc><rect width="800" height="400" rx="14" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="398" rx="13" fill="none" stroke="#DCE5EE"/><text x="34" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#1A2A3C">함수 단원 학습 흐름</text><text x="34" y="57" font-family="sans-serif" font-size="12" fill="#56687A">수학적 입력·출력 관계를 해석하는 네 가지 관점</text><rect x="40" y="135" width="154" height="110" rx="14" fill="#EEF4FA" stroke="#2465A5" stroke-width="2"/><text x="117" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">합성함수</text><text x="117" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">적용 순서</text><path d="M202 190 h13.666666666666664 l-8 -7 m8 7 l-8 7" stroke="#D67C39" fill="none" stroke-width="2.5" stroke-linecap="round"/><rect x="228.66666666666666" y="135" width="154" height="110" rx="14" fill="#EFF8F6" stroke="#008F86" stroke-width="2"/><text x="305.66666666666663" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">역함수</text><text x="305.66666666666663" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">입력 복원</text><path d="M390.66666666666663 190 h13.666666666666664 l-8 -7 m8 7 l-8 7" stroke="#D67C39" fill="none" stroke-width="2.5" stroke-linecap="round"/><rect x="417.3333333333333" y="135" width="154" height="110" rx="14" fill="#EEF4FA" stroke="#2465A5" stroke-width="2"/><text x="494.3333333333333" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">극한·연속</text><text x="494.3333333333333" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">근처의 행동</text><path d="M579.3333333333333 190 h13.6666666666