<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">합성함수: 센서 출력의 연속 변환</title><desc id="desc">본문의 가상 보정식과 섭씨→화씨 단위 변환</desc><rect width="800" height="400" rx="14" fill="#FFFFFF"/><rect x="1" y="1" width="798" height="398" rx="13" fill="none" stroke="#DCE5EE"/><text x="34" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#1A2A3C">합성함수: 센서 출력의 연속 변환</text><text x="34" y="57" font-family="sans-serif" font-size="12" fill="#56687A">본문의 가상 보정식과 섭씨→화씨 단위 변환</text><rect x="40" y="135" width="190" height="110" rx="14" fill="#EEF4FA" stroke="#2465A5" stroke-width="2"/><text x="135" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">입력</text><text x="135" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">전압 v (V)</text><path d="M238 190 h54 l-8 -7 m8 7 l-8 7" stroke="#D67C39" fill="none" stroke-width="2.5" stroke-linecap="round"/><rect x="305" y="135" width="190" height="110" rx="14" fill="#EFF8F6" stroke="#008F86" stroke-width="2"/><text x="400" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">f(v)</text><text x="400" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">T = 100v − 50</text><path d="M503 190 h54 l-8 -7 m8 7 l-8 7" stroke="#D67C39" fill="none" stroke-width="2.5" stroke-linecap="round"/><rect x="570" y="135" width="190" height="110" rx="14" fill="#EEF4FA" stroke="#2465A5" stroke-width="2"/><text x="665" y="179" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A2A3C">g(T)</text><text x="665" y="211" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">F = 1.8T + 32</text><text x="400" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#56687A">g(f(v)) = 180v − 58  ·  변환 순서는 일반적으로 바꿀 수 없습니다.</text></svg>