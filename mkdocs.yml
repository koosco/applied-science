site_name: Applied Science
site_url: https://koosco.github.io/applied-science/
site_description: 수학과 공학의 원리를 배우고 시뮬레이션으로 검증하는 학습 노트
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - content.code.copy
nav:
  - 시작: index.md
  - 수학:
      - 미적분:
          - 학습 목차: mathematics/calculus/index.md
          - 함수:
              - 개요와 학습 순서: mathematics/calculus/functions/index.md
              - 합성함수: mathematics/calculus/functions/composition.md
              - 단사·전사와 역함수: mathematics/calculus/functions/inverse-functions.md
              - 함수의 극한과 연속: mathematics/calculus/functions/limits-and-continuity.md
              - 주기 함수와 신호 시스템: mathematics/calculus/functions/periodic-signals.md
          - 미분법:
              - 개요와 학습 순서: mathematics/calculus/differentiation/index.md
              - 미분계수와 도함수: mathematics/calculus/differentiation/derivatives-and-tangents.md
              - 기본 미분법: mathematics/calculus/differentiation/basic-rules.md
              - 비행 궤적의 고계도함수: mathematics/calculus/differentiation/trajectory-derivatives.md
              - 도함수로 극값 찾기: mathematics/calculus/differentiation/extrema.md
              - 롤의 정리: mathematics/calculus/differentiation/theorems/rolle.md
              - 코시의 평균값 정리: mathematics/calculus/differentiation/theorems/cauchy-mean-value.md
              - 로피탈의 정리: mathematics/calculus/differentiation/theorems/lhopital.md
              - 역함수의 미분법: mathematics/calculus/differentiation/inverse-function-derivatives.md
              - 음함수의 미분법: mathematics/calculus/differentiation/implicit-differentiation.md
          - 부정적분:
              - 개요와 계산 순서: mathematics/calculus/indefinite-integrals/index.md
              - 기본 공식: mathematics/calculus/indefinite-integrals/basic-rules.md
              - 합성함수와 치환적분: mathematics/calculus/indefinite-integrals/substitution.md
              - 삼각함수 적분: mathematics/calculus/indefinite-integrals/trigonometric-integrals.md
              - 부분적분: mathematics/calculus/indefinite-integrals/integration-by-parts.md
              - 유리함수와 부분분수: mathematics/calculus/indefinite-integrals/partial-fractions.md
              - 삼각치환: mathematics/calculus/indefinite-integrals/trigonometric-substitution.md
  - 역학:
      - 포물선 운동: mechanics/projectile-motion.md
exclude_docs: |
  /convention/
  /learning-scope.md
  /simulations/**/CLAUDE.md
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
